name: TikTok Auto Sync Cron (Hourly 0€)

on:
  schedule:
    # Exécution automatique toutes les 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Déclenchement manuel

jobs:
  sync-tiktok-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install firebase dotenv

      - name: Execute Full TikTok Sync (Catalog, Metrics & Live) to Firestore
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY || 'sbawn81yw1l5ityq7b' }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET || 'MiErBVWIjZAfzhLX6QMCCIu9qlxvLaR1' }}
        run: node scripts/sync-tiktok.mjs
