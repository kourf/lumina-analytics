name: TikTok Auto Sync Cron (Hourly 0€)

on:
  schedule:
    # Exécution automatique toutes les heures (0 * * * *)
    - cron: '0 * * * *'
  workflow_dispatch: # Déclenchement manuel

jobs:
  sync-tiktok-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase dependencies
        run: npm install firebase

      - name: Execute Live TikTok Sync to Firestore
        run: node scripts/sync-tiktok.mjs
